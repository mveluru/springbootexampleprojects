server:
  port:
    8081
  servlet:
    context-path: /brite/api

management:
  endpoints:
    web:
      base-path: /actuator

app:
  name: "Brite Technology Notifications"

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_example?useSSL=false
    username: root
    password: Ritvik24!
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  config:
    additional-location: classpath:properties/common/

  #Check your one note

notification:
    email:
      enabled: true
      from-address: "no-reply@britesolutions.org"
      support-address: "britesupport@britesolutions.org"
      daily-limit: 200
      default-recipients:
        - "briteadmin@britesolutions.dev"
        - "britesupport@britesolutions.dev"

    sms:
      enabled: false
      sender-id: "customerGM"
      daily-limit: 100

    retry:
      max-attempts: 3
      backoff-millis: 500

    templates:
      welcome: "Welcome Brite Order Name, {{name}}!"
      otp: "Your OTP is {{code}}"
      newsletter: "Hi {{person name}}, here is our latest content."

    timeout-seconds: 1
    connection-pool-size: 10

feature:
    experimental-mode: true