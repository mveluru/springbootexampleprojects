server:
  port:
    8081
  servlet:
    context-path: /brite

management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_example?useSSL=false
    username: root
    password: Ritvik24!
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

notification:
    email:
      enabled: true
      from-address: "no-reply@britesolutions.org"
      support-address: "britesupport@britesolutions.org"
      daily-limit: 200

    sms:
      enabled: false
      sender-id: "customerGM"
      daily-limit: 100

    timeout-seconds: 1
    connection-pool-size: 10

banking:
  constraints:
    maximum-deposit-amount-by-cash: 5000.00
    minimum-age: 18
    checking-minimum-balance: 25.00
    saving-minimum-balance: 100.00
    max-statement-range-months: 18

resilience4j:
  circuitbreaker:
    instances:
      bankService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      bankService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException